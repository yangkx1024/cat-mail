name: Release

# Run by hand on main, it releases: it sets the workspace version (the patch after the
# current one, or the version given), commits that to main with the tag `v<version>`,
# builds the Linux packages from the tag and publishes them as a GitHub release. Pull
# requests that change the packaging build them too, uploaded as workflow artifacts only.
#
# One run does it all: a tag pushed with GITHUB_TOKEN starts no other workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.2.0 (empty: the next patch)"
        required: false
        default: ""
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tagged before the build, so the packages are built from the release commit (the
  # commit in their logs). A build that fails after it leaves the tag without a release:
  # re-run the failed jobs, or release the next version.
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          die() { echo "error: $*" >&2; exit 1; }
          pkgid=$(cargo pkgid -p catmail-gui)
          current=${pkgid##*[#@]}
          if [[ $GITHUB_EVENT_NAME != workflow_dispatch ]]; then
            echo "version=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ $GITHUB_REF == refs/heads/main ]] || die "releases are made from main"
          if [[ -z $REQUESTED ]]; then
            IFS=. read -r major minor patch <<< "$current"
            version=$major.$minor.$((patch + 1))
          else
            version=${REQUESTED#v}
          fi
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            die "$version isn't a version like 1.2.3"
          # The same version as now releases it as it is (the first release).
          [[ $(printf '%s\n' "$current" "$version" | sort -V | tail -n 1) == "$version" ]] ||
            die "$version is older than the current $current"
          ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null ||
            die "v$version is already tagged"

          # Every crate takes the workspace's version; its line is the first `version`.
          sed -i "0,/^version = \".*\"$/s//version = \"$version\"/" Cargo.toml
          cargo update --workspace
          pkgid=$(cargo pkgid -p catmail-gui)
          [[ ${pkgid##*[#@]} == "$version" ]] || die "Cargo.toml still says ${pkgid##*[#@]}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release v$version"
          fi
          git tag -a "v$version" -m "catmail $version"
          # Atomic: if main moved since the run started, neither the commit nor the tag
          # lands, and the run can simply be started again.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=v$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    # The oldest glibc a package runs on is the one it was built against: Ubuntu 22.04's
    # 2.35, which build-appimage.sh checks.
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The tag on a release; otherwise what triggered the run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools and GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            patchelf zsync

      - name: AppImage
        run: packaging/linux/build-appimage.sh

      # The CLI isn't in the AppImage (one entry point, the GUI): a tarball of the binary.
      - name: CLI tarball
        run: |
          cargo build --release --locked -p catmail-cli
          name=catmail-$VERSION-${{ matrix.arch }}-linux
          mkdir -p "target/cli/$name"
          cp target/release/catmail LICENSE-MIT LICENSE-APACHE "target/cli/$name/"
          tar -C target/cli -czf "target/cli/$name.tar.gz" "$name"

      # Everything to publish in one directory: an artifact keeps the paths below the
      # common parent of what it uploads, and the release takes the files as they are.
      - name: Collect the packages
        run: |
          mkdir -p target/dist
          cp target/appimage/*.AppImage target/appimage/*.AppImage.zsync target/cli/*.tar.gz \
            target/dist/

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: target/dist/
          if-no-files-found: error

  publish:
    name: Publish
    if: needs.version.outputs.ref != ''
    needs: [version, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist

      # Not a prerelease: AppImageUpdate looks for the .zsync in the latest release, which
      # leaves prereleases out.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.ref }}
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --generate-notes ./*
