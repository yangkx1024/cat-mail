name: Release

# Run by hand on main, it releases: it sets the workspace version (the patch after the
# current one, or the version given), commits that to main with the tag `v<version>`,
# builds the macOS app, the Linux app as a Flatpak bundle (on the GNOME runtime, which
# brings WebKitGTK) and the CLI for Linux and macOS from the tag and publishes them as a
# GitHub release, with the feed (appcast.xml) and updates Sparkle updates the macOS app
# from. The macOS ones are signed with the Developer ID and notarized, with the secrets of the
# `release` environment; pull requests can't have those and sign ad hoc. Run with
# `build_only` (on any branch), and pull requests that change the packaging, build them
# at the current version, uploaded as workflow artifacts only.
#
# One run does it all: a tag pushed with GITHUB_TOKEN starts no other workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.2.0 (empty: the next patch)"
        required: false
        default: ""
      build_only:
        description: "Only build the packages: no version change, tag or release"
        type: boolean
        default: false
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

# A build-only run in its own group: it must not queue behind, or replace, a release.
concurrency:
  group: ${{ inputs.build_only && 'build' || 'release' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tagged before the build, so the packages are built from the release commit (the
  # commit in their logs). A build that fails after it leaves the tag without a release:
  # re-run the failed jobs, or release the next version.
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          die() { echo "error: $*" >&2; exit 1; }
          pkgid=$(cargo pkgid -p catmail-gui)
          current=${pkgid##*[#@]}
          [[ $BUILD_ONLY != true || -z $REQUESTED ]] ||
            die "a build-only run builds the current version $current, not $REQUESTED"
          if [[ $GITHUB_EVENT_NAME != workflow_dispatch || $BUILD_ONLY == true ]]; then
            echo "version=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ $GITHUB_REF == refs/heads/main ]] || die "releases are made from main"
          if [[ -z $REQUESTED ]]; then
            IFS=. read -r major minor patch <<< "$current"
            version=$major.$minor.$((patch + 1))
          else
            version=${REQUESTED#v}
          fi
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            die "$version isn't a version like 1.2.3"
          # The same version as now releases it as it is (the first release).
          [[ $(printf '%s\n' "$current" "$version" | sort -V | tail -n 1) == "$version" ]] ||
            die "$version is older than the current $current"
          ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null ||
            die "v$version is already tagged"

          # Every crate takes the workspace's version; its line is the first `version`.
          sed -i "0,/^version = \".*\"$/s//version = \"$version\"/" Cargo.toml
          cargo update --workspace
          pkgid=$(cargo pkgid -p catmail-gui)
          [[ ${pkgid##*[#@]} == "$version" ]] || die "Cargo.toml still says ${pkgid##*[#@]}"

          # The AppStream release, newest first: the version GNOME Software and
          # `flatpak remote-ls` show for the Flatpak.
          metainfo=packaging/linux/net.yangkx.catmail.appdata.xml
          if ! grep -qF "<release version=\"$version\"" "$metainfo"; then
            sed -i "/^  <releases>$/a\\    <release version=\"$version\" date=\"$(date -u +%F)\"/>" \
              "$metainfo"
          fi
          newest=$(sed -n 's/^ *<release version="\([^"]*\)".*/\1/p' "$metainfo" | head -n 1)
          [[ $newest == "$version" ]] || die "$metainfo's newest release is ${newest:-none}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release v$version"
          fi
          git tag -a "v$version" -m "catmail $version"
          # Atomic: if main moved since the run started, neither the commit nor the tag
          # lands, and the run can simply be started again.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=v$version" >> "$GITHUB_OUTPUT"

      # GitHub's, from the pull requests since the last release: once, for both the
      # release page and the update's window (the feed), so the two say the same.
      - name: Release notes
        id: notes
        if: steps.version.outputs.ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.ref }}
        run: |
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" \
            --jq .body)
          delimiter=notes-$(openssl rand -hex 16)
          {
            echo "notes<<$delimiter"
            echo "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  linux:
    name: Linux CLI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    # The oldest glibc the CLI runs on is the one it was built against: Ubuntu 22.04's 2.35.
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The tag on a release; otherwise what triggered the run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: CLI tarball
        run: |
          cargo build --release --locked -p catmail-cli
          name=catmail-$VERSION-${{ matrix.arch }}-linux
          mkdir -p "target/cli/$name"
          cp target/release/catmail LICENSE-MIT LICENSE-APACHE "target/cli/$name/"
          tar -C target/cli -czf "target/cli/$name.tar.gz" "$name"

      # Everything to publish in one directory: an artifact keeps the paths below the
      # common parent of what it uploads, and the release takes the files as they are.
      - name: Collect the packages
        run: |
          mkdir -p target/dist
          cp target/cli/*.tar.gz target/dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: target/dist/
          if-no-files-found: error

  flatpak:
    name: Linux Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    needs: version
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      # Only for `cargo vendor` and the version: the app is built with the SDK's Rust.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # Ubuntu 24.04 keeps unprivileged user namespaces, which bwrap (the build's
      # sandbox) needs, from programs without an AppArmor profile of their own.
      # librsvg2-common is only recommended, but without its SVG loader appstreamcli
      # compose can't read the icon (`file-read-error`); the arm image happens to have it.
      - name: Flatpak tools
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder \
            librsvg2-common
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      # Not for the release (no `dist-` prefix): `flatpak-repo` makes the bundle to publish.
      - name: Flatpak bundle
        run: packaging/linux/build-flatpak.sh --no-install

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-build-${{ matrix.arch }}
          path: target/flatpak/*.flatpak
          if-no-files-found: error

  # The Flatpak repository installs update from (on R2): only once every package built,
  # and before the release is created, as it is what users get. Pull requests and
  # build-only runs try it on an empty local repository, signed with a key made for the run.
  flatpak-repo:
    name: Linux Flatpak repository
    needs: [version, linux, flatpak, macos]
    runs-on: ubuntu-24.04
    environment: ${{ needs.version.outputs.ref != '' && 'release' || '' }}
    env:
      RELEASE: ${{ needs.version.outputs.ref != '' }}
      # The bucket R2_* reach, and the repository in it: the path of the .flatpakrepo's Url.
      REMOTE: s3://catmail/flatpak/
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't take every checksum newer AWS CLIs send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree

      - uses: actions/download-artifact@v8
        with:
          pattern: flatpak-build-*
          merge-multiple: true
          path: ${{ runner.temp }}/bundles

      - name: Signing key
        if: env.RELEASE == 'true'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          [[ -n $FLATPAK_GPG_PRIVATE_KEY ]] || { echo "error: no FLATPAK_GPG_PRIVATE_KEY" >&2; exit 1; }
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      # The whole repository: a few versions of each arch, and their deltas.
      - name: Download the repository
        if: env.RELEASE == 'true'
        run: aws s3 sync --no-progress "$REMOTE" "$RUNNER_TEMP/repo"

      - name: Update the repository
        run: |
          test_key=()
          [[ $RELEASE == true ]] || test_key=(--test-key)
          packaging/linux/update-flatpak-repo.sh "${test_key[@]}" "$RUNNER_TEMP/repo" \
            "$RUNNER_TEMP"/bundles/*.flatpak

      # In three passes, so a client never reads a summary that points at something not
      # there yet, or that was already deleted: what the new commits are made of, then
      # what names them (refs, summary), and only then the deletions.
      - name: Upload the repository
        if: env.RELEASE == 'true'
        run: |
          # tmp/ is ostree's scratch space, not part of what it serves.
          sync=(aws s3 sync --no-progress --exclude 'tmp/*' "$RUNNER_TEMP/repo" "$REMOTE")
          "${sync[@]}" --exclude 'config' --exclude 'refs/*' --exclude 'summary*'
          "${sync[@]}"
          "${sync[@]}" --delete

      # Through the CDN, as an installed app sees it: it offers what was just uploaded.
      - name: Check the repository
        if: env.RELEASE == 'true'
        run: packaging/linux/update-flatpak-repo.sh --check "$RUNNER_TEMP/repo"

      - uses: actions/upload-artifact@v7
        if: env.RELEASE == 'true'
        with:
          name: dist-flatpak
          path: target/flatpak/signed/*.flatpak
          if-no-files-found: error

  macos:
    name: macOS (aarch64)
    needs: version
    # AppKit draws a window in the current system's style (Liquid Glass window buttons and
    # toolbars) only for an app linked against the macOS 26 SDK or later; macos-15's
    # default Xcode links against 15.5, which gets the old style on new systems.
    runs-on: macos-26
    # Two rounds with the notary, which now and then takes a while.
    timeout-minutes: 90
    # The signing identity and the notary's key, for manual runs only.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release' || '' }}
    env:
      SIGNED: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # build-dmg.sh installs resvg from source when it has none of the version it pins;
      # keyed by that version. Caches written by a pull request are kept to its own ref,
      # so a release only runs a resvg that a run on main built.
      - name: resvg version
        id: resvg
        run: |
          version=$(sed -n 's/^resvg_version=//p' packaging/macos/build-dmg.sh)
          [[ -n $version ]] || { echo "error: no resvg_version in build-dmg.sh" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: target/macos/tools/bin
          key: resvg-${{ steps.resvg.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      # A keychain of its own, holding the identity and the intermediate it chains to.
      - name: Signing identity
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          die() { echo "error: $*" >&2; exit 1; }
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf %s "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/identity.p12"
          ca=$RUNNER_TEMP/DeveloperIDG2CA.cer
          curl -fsSL --retry 3 -o "$ca" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $ca" |
            shasum -a 256 -c --quiet - || die "DeveloperIDG2CA.cer doesn't match its hash"
          security import "$ca" -k "$keychain"
          # Lets codesign use the key without asking.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" \
            "$keychain" > /dev/null
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # one keychain per word
          security list-keychains -d user -s "$keychain" $existing
          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk -v team="($APPLE_TEAM_ID)\"" \
              '/"Developer ID Application: / && index($0, team) { print $2; exit }')
          if [[ -z $identity ]]; then
            security find-identity -v -p codesigning "$keychain"
            die "no valid Developer ID Application identity of the team $APPLE_TEAM_ID"
          fi
          {
            echo "CATMAIL_SIGN_IDENTITY=$identity"
            echo "CATMAIL_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Notary key
        if: env.SIGNED == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          key=$RUNNER_TEMP/notary-key.p8
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          {
            echo "CATMAIL_NOTARY_KEY=$key"
            echo "CATMAIL_NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "CATMAIL_NOTARY_ISSUER=$APPLE_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      # Sparkle's private key: build-dmg.sh signs the update and its deltas with it.
      - name: Update key
        if: env.SIGNED == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          die() { echo "error: $*" >&2; exit 1; }
          [[ -n $SPARKLE_ED_PRIVATE_KEY ]] || die "no SPARKLE_ED_PRIVATE_KEY"
          key=$RUNNER_TEMP/sparkle-key
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          {
            echo "CATMAIL_UPDATE_KEY=$key"
            echo "CATMAIL_UPDATE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/"
          } >> "$GITHUB_ENV"

      # The updates of the three newest older releases, for a delta from each: the
      # published ones, stapled, which is what users have installed. A release from before
      # Sparkle has none and is passed over: it doesn't update itself.
      - name: Older versions
        if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dir=$RUNNER_TEMP/older
          mkdir -p "$dir"
          # Each release's update, as "<tag> <asset>", among the 100 newest releases:
          # plenty to find three. Fetched first, so a failure stops the step.
          updates=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]
            | select((.draft or .prerelease) | not) | .tag_name as $tag
            | .assets[] | select(.name | endswith("-aarch64.app.zip")) | "\($tag) \(.name)"')
          count=0
          # By version, newest first.
          while read -r tag asset; do
            [[ -n $tag ]] || continue
            version=${tag#v}
            # Older only: a build-only run builds a version that may be out already.
            [[ $version != "$VERSION" &&
              $(printf '%s\n' "$version" "$VERSION" | sort -V | head -n 1) == "$version" ]] ||
              continue
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$dir"
            count=$((count + 1))
            [[ $count -lt 3 ]] || break
          done < <(sort -rV <<< "$updates")
          ls -l "$dir"
          echo "CATMAIL_DELTA_FROM=$dir" >> "$GITHUB_ENV"

      - name: Release notes
        if: needs.version.outputs.notes != ''
        env:
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          echo "CATMAIL_RELEASE_NOTES=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Disk image and CLI tarball
        run: packaging/macos/build-dmg.sh

      - name: Collect the packages
        run: |
          mkdir -p target/dist
          cp target/macos/*.dmg target/macos/*.tar.gz target/dist/
          # The update, its deltas and the feed.
          if [[ $SIGNED == true ]]; then
            cp target/macos/updates/* target/dist/
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-aarch64
          path: target/dist/
          if-no-files-found: error

  publish:
    name: Publish
    if: needs.version.outputs.ref != ''
    needs: [version, linux, flatpak-repo, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # What a job made for the release: `dist-*`, not intermediate artifacts.
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # Neither a draft nor a prerelease, and marked the latest: installed apps read the
      # feed through releases/latest/download/appcast.xml.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.ref }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$TAG" --notes "$NOTES" ./*

      # What installed apps read: the feed their Info.plist names (SUFeedURL in
      # packaging/macos/Info.plist), redirected to the latest release's appcast.xml.
      - name: Check the feed
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          die() { echo "error: $*" >&2; exit 1; }
          feed=https://catmail.yangkx.net/appcast.xml
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 3 "$feed" |
              grep -qF "<sparkle:version>$VERSION</sparkle:version>"; then
              echo "$feed offers $VERSION"
              break
            fi
            [[ $attempt -lt 6 ]] || die "$feed doesn't offer $VERSION"
            echo "$feed doesn't offer $VERSION yet (attempt $attempt)"
            sleep 20
          done
