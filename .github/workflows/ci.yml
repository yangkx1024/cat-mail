name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - "LICENSE-*"
  pull_request:
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # The core must stay platform-neutral, so lint and test on every target OS from the
  # start, even though only Linux is shipped for now.
  check:
    name: Clippy & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # What catmail-gui (GPUI) links against on Linux. Its tests run on GPUI's test
      # platform, so no display or GPU is needed.
      - name: Install GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The fake server covers faults on every OS; this checks the client against a real
  # server. Dovecot comes from the flake's `imap` dev shell, so Linux only.
  dovecot:
    name: Real-server tests (Dovecot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Start Dovecot
        run: |
          nix develop .#imap -c testenv/dovecot/run.sh > dovecot.log 2>&1 &
          for _ in $(seq 1 120); do
            grep -q "starting up" dovecot.log && break
            sleep 1
          done
          cat dovecot.log
          grep '^export ' dovecot.log | sed 's/^export //' | tr ' ' '\n' >> "$GITHUB_ENV"

      - name: Test
        env:
          CATMAIL_TEST_IMAP_REQUIRED: "1" # fail instead of skipping
        run: nix develop .#imap -c cargo test -p catmail-core --test dovecot --locked -- --nocapture
