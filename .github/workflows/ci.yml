name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - "LICENSE-*"
  pull_request:
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # File and line in backtraces, without the full debug info: a third smaller target
  # directory, so a smaller cache to pack, upload and unpack.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # The core must stay platform-neutral, so lint and test on every target OS from the
  # start, even though only Linux is shipped for now. Pull requests run the tests on Linux
  # only: macOS and Windows still compile them (clippy covers all targets) but run them
  # once merged, on main, where macOS minutes cost 10x and Windows ones 2x.
  #
  # On Linux the tests also run against real servers: Dovecot for IMAP and SMTP
  # submission, relaying to mailpit (the fake servers cover faults on every OS). Only the
  # servers come from the flake's `testenv` dev shell; cargo stays on this job's toolchain
  # so the real-server tests reuse its cached build instead of compiling from scratch.
  check:
    name: Clippy & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Real-time scanning of every file compiled, linked and unpacked from the cache
      # slows the Windows job down; the runner is thrown away after it.
      - name: Turn off Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        if: runner.os == 'Linux'

      # In the background, so fetching the dev shell overlaps the cache restore and clippy.
      - name: Start the real servers
        if: runner.os == 'Linux'
        run: nix develop .#testenv -c testenv/dovecot/run.sh > dovecot.log 2>&1 &

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Saved from main only; pull requests restore main's. A cache saved for a pull
      # request is scoped to it, and each one (over 1 GB per OS) pushed main's out of the
      # repository's 10 GB, leaving later runs with partial hits that saved again.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # What catmail-gui (GPUI) links against on Linux. Its tests run on GPUI's test
      # platform, so no display or GPU is needed.
      - name: Install GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Exports what run.sh prints, so `dovecot` and `submission` in the test run below
      # use the servers. Only here: the tests treat CATMAIL_TESTENV_REQUIRED as set even
      # when empty, so it must not reach the other OSes.
      - name: Wait for the real servers
        if: runner.os == 'Linux'
        run: |
          for _ in $(seq 1 120); do
            grep -q "starting up" dovecot.log && break
            sleep 1
          done
          cat dovecot.log
          grep -q "starting up" dovecot.log
          grep '^export ' dovecot.log | sed 's/^export //' | tr ' ' '\n' >> "$GITHUB_ENV"
          echo "CATMAIL_TESTENV_REQUIRED=1" >> "$GITHUB_ENV" # fail instead of skipping

      - name: Test
        if: runner.os == 'Linux' || github.event_name != 'pull_request'
        run: cargo test --workspace --locked
