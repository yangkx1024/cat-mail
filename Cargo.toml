[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
catmail-types = { path = "crates/catmail-types" }
catmail-store = { path = "crates/catmail-store" }
catmail-proto = { path = "crates/catmail-proto" }
catmail-html = { path = "crates/catmail-html" }
catmail-core = { path = "crates/catmail-core" }
catmail-frontend = { path = "crates/catmail-frontend" }
catmail-testkit = { path = "crates/catmail-testkit" }

ammonia = "4.2.4"
anyhow = "1"
base64 = "0.22.1"
clap = { version = "4.6", features = ["derive", "env"] }
# The GUI quits as the tray's Quit does on SIGINT, SIGTERM and SIGHUP on macOS, on its own
# thread, without tokio (GTK's loop takes them on Linux).
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6"
# `canonicalize` without Windows' `\\?\` prefix, which a socket path can't take.
dunce = "1.0.5"
# Reads header fields in raw 8-bit bytes in a legacy charset; the version mail-parser
# decodes text with.
encoding_rs = "0.8.42"
# Rewrites message style sheets token by token.
cssparser = "0.38.0"
# Reads CSS colors and converts them to OKLab, for a dark reader.
color = "0.3.3"
# Replies from other threads to the UI's tasks.
futures-channel = "0.3.34"
# Runs an outbox pass's SMTP connections side by side within the pass's own task.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
# SIGINT and SIGTERM on GTK's loop in catmail-gui; the glib that gtk4 uses.
glib-unix = "0.22"
hex = "0.4"
# The version ammonia uses, so the sanitizer and the layout pass share one parser.
html5ever = "0.40.1"
jiff = "0.2.38"
# The Linux tray icon (StatusNotifierItem over D-Bus, no GTK). On async-io, the runtime
# of the zbus already in the tree (notifications, the keyring), not tokio.
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
# Parses IMAP responses only; catmail-proto encodes commands and drives the connection.
imap-proto = "0.18.0"
keyring = "4.2"
# glibc's malloc_trim, which hands what the windows freed back to the system.
libc = "0.2.191"
# Builds outgoing messages; the same family as mail-parser. Without `gethostname`:
# Message-IDs come from the sender's domain, not the machine's name.
mail-builder = { version = "1.0.0", default-features = false }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
mime_guess = "2.0.5"
# Native Shell, catmail-gui's toolkit: GTK 4 on Linux and AppKit on macOS, bodies in web
# views (WebKitGTK, WKWebView). Unreleased main, for its handling of taffy's `calc`
# (longbridge/nsh#966), GTK children measured before they are allocated (#1048),
# WebKit's network process ending with the last web view (#1051) and macOS's hidden title
# bar at the app's height, the traffic lights centered in it (#1068). Back to crates.io (and
# the repository out of `allow-git` in deny.toml) once a release has what catmail-gui uses.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "0a9fa7b1859d2e24bc7b829385b37692182f6dc3" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "0a9fa7b1859d2e24bc7b829385b37692182f6dc3", default-features = false }
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", rev = "0a9fa7b1859d2e24bc7b829385b37692182f6dc3", default-features = false, features = ["webview"] }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "0a9fa7b1859d2e24bc7b829385b37692182f6dc3", default-features = false }
# catmail-gui's AppKit shell: the main thread's futures on the main dispatch queue
# (async-task), and the event monitor's block (the versions nsh's macOS platform uses).
async-task = "4.7.1"
block2 = "0.6.2"
dispatch2 = "0.3.1"
# The macOS status item (menu bar icon, its menu, the Dock badge): AppKit straight, no
# tray crate. The versions nsh's macOS platform uses.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSDockTile",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSObject",
    "NSString",
] }
pollster = "1"
# Remote images, when the user asks to see them. Without default features: rustls on our
# ring configuration (`use_preconfigured_tls`), no native-tls, no HTTP/2, no system proxy
# lookup.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-no-provider"] }
# catmail-gui's tray icon pixels: nsh-core's resvg, with text for the badge's digits.
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }
# Reads iTerm2 color schemes (XML property lists).
quick-xml = "0.41.0"
rcgen = "0.14"
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
# ring instead of the default aws-lc-rs: no cmake/NASM needed on Windows CI.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
# The current user, to check who owns the data directory (std has no safe getuid).
rustix = { version = "1.1.5", features = ["process"] }
# Keeps passwords out of Debug output and zeroes them when dropped.
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# TCP keepalive, which tokio's TcpStream doesn't expose.
socket2 = "0.6.5"
tempfile = "3"
thiserror = "2"
tokio = "1.53"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# Reads Alacritty and WezTerm color schemes.
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Unix sockets on Windows (std has them on Unix only), for the single-instance socket.
uds_windows = "1.2.1"
unicode-width = "0.2.2"
# The URL parser ammonia uses; the sanitizer's own checks must agree with it.
url = "2.5.8"
uuid = { version = "1.28", features = ["v4"] }

# Thin LTO with one codegen unit, and stripped of symbols: a smaller binary. A panic's
# backtrace then shows addresses only; the message and location are still logged.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
# Not forbid, which a crate couldn't loosen: catmail-frontend's `memory` module calls
# malloc_trim, its macOS status item and catmail-gui's AppKit shell call AppKit. Every
# other crate forbids it at its root.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Unreleased imap-proto 0.18.0, for its unescaping of quoted strings (djc/imap-proto#209).
# Replace with the crates.io release once it is out, and take the repository out of
# `allow-git` in deny.toml (#130).
[patch.crates-io]
imap-proto = { git = "https://github.com/djc/imap-proto", rev = "0dac3af59a2cfcd649c30034d5f221c4d8edbf34" }
