[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
catmail-types = { path = "crates/catmail-types" }
catmail-store = { path = "crates/catmail-store" }
catmail-proto = { path = "crates/catmail-proto" }
catmail-core = { path = "crates/catmail-core" }
catmail-testkit = { path = "crates/catmail-testkit" }
catmail-render = { path = "crates/catmail-render" }

ammonia = "4.2.4"
anyhow = "1"
# Blitz paints through anyrender; vello_cpu rasterizes on the CPU, off the UI thread.
anyrender = "0.14.0"
anyrender_vello_cpu = "0.18.0"
base64 = "0.22.1"
# What Blitz takes image content as; the reader hands over its images without copying.
bytes = "1.12.1"
# Blitz is still in beta and its crates require each other at exact versions. Without
# blitz-dom's default `svg` feature: usvg resolves nested images from the local disk.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["floats", "system-fonts"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
clap = { version = "4.6", features = ["derive", "env"] }
# WHATWG data: URL parsing; the one gpui-kit uses for the same job.
data-url = "0.3.2"
directories = "6"
# Rewrites message style sheets token by token; the version Stylo (in Blitz) uses.
cssparser = "0.38.0"
# Replies from the render threads to the UI's tasks; the version GPUI uses.
futures-channel = "0.3.34"
# Pins the matching GPUI crates; never depend on GPUI directly (two copies would link).
# `gpui-fast` swaps the backend from gpui-pre to GPUI Fast behind the same imports.
gpui-kit = { version = "0.8.0", features = ["gpui-fast"] }
hex = "0.4"
# The version ammonia uses, so the sanitizer and the layout pass share one parser.
html5ever = "0.40.1"
jiff = "0.2.38"
# Wraps rendered pages into GPUI images; the version GPUI uses.
image = { version = "0.25.10", default-features = false }
# Without the default `stream` feature: catmail-proto drives the sans-IO client itself,
# over any AsyncRead + AsyncWrite (TLS, STARTTLS upgrades, in-memory test pipes).
imap-next = { version = "0.3.4", default-features = false, features = ["starttls", "ext_condstore_qresync"] }
keyring = "4.2"
# Builds outgoing messages; the same family as mail-parser. Without `gethostname`:
# Message-IDs come from the sender's domain, not the machine's name.
mail-builder = { version = "1.0.0", default-features = false }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
mime_guess = "2.0.5"
# Workaround: imap-codec 2.0.0-alpha.9 uses nom's `alloc`-gated combinators but depends on
# nom with default features off, so it only builds when something else enables them.
nom = { version = "7.1.3", default-features = false, features = ["alloc"] }
# Blitz lays text out with it; the reader's text selection reads those layouts. The
# version Blitz uses.
parley = { version = "0.12.0", default-features = false, features = ["std"] }
pollster = "1"
# Remote images, when the user asks to see them. Without default features: rustls on our
# ring configuration (`use_preconfigured_tls`), no native-tls, no HTTP/2, no system proxy
# lookup.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-no-provider"] }
# Reads iTerm2 color schemes (XML property lists); the version GPUI's platform crates use.
quick-xml = "0.41.0"
rcgen = "0.14"
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
# ring instead of the default aws-lc-rs: no cmake/NASM needed on Windows CI.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
# The current user, to check who owns the data directory (std has no safe getuid).
rustix = { version = "1.1.5", features = ["process"] }
# Keeps passwords out of Debug output and zeroes them when dropped.
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
# Stylo, Blitz's CSS engine, for the computed styles the reader's text selection reads
# (what is hidden). The version Blitz uses, under the name Blitz gives it.
style = { package = "stylo", version = "0.22.0", default-features = false }
serde_json = "1"
sha2 = "0.11"
# TCP keepalive, which tokio's TcpStream doesn't expose.
socket2 = "0.6.5"
tempfile = "3"
thiserror = "2"
tokio = "1.53"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# Reads Alacritty and WezTerm color schemes.
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2.2"
# The URL parser ammonia uses; the sanitizer's own checks must agree with it.
url = "2.5.8"
uuid = { version = "1.28", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
