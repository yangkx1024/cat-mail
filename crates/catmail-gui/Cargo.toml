[package]
name = "catmail-gui"
description = "Desktop frontend for catmail, built on GPUI Kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "catmail-gui"
path = "src/main.rs"

[dependencies]
catmail-core.workspace = true
catmail-frontend.workspace = true
catmail-render.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
directories.workspace = true
futures-channel.workspace = true
gpui-kit.workspace = true
image.workspace = true
jiff.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[dev-dependencies]
catmail-testkit.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
pollster.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
