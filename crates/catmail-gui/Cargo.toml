[package]
name = "catmail-gui"
description = "Desktop frontend for catmail, built on GPUI Kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "catmail-gui"
path = "src/main.rs"

[dependencies]
catmail-core.workspace = true
catmail-render.workspace = true
anyhow.workspace = true
clap.workspace = true
data-url.workspace = true
directories.workspace = true
dunce.workspace = true
futures-channel.workspace = true
gpui-kit.workspace = true
image.workspace = true
jiff.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ksni.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
uds_windows.workspace = true

[dev-dependencies]
catmail-testkit.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
pollster.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
