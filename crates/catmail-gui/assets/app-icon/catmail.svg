      .paper { fill: #f3e8d7; }
      .fold { fill: #e3d3bc; }
      .outline { stroke: #b8c2b2; }
      .crease { stroke: #cebaa0; }
      .paw { fill: #bd603b; }
    }
  </style>
  <defs>
