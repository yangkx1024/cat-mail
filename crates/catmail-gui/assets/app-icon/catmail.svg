  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect class="edge" x="17" y="17" width="478" height="478" rx="111" fill="none" stroke-width="2"/>
  <g transform="rotate(-7 256 264)">
