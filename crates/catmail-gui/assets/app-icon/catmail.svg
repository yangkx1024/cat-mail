      <ellipse cx="316" cy="260" rx="18" ry="25" transform="rotate(26 316 260)"/>
      <path d="M258 267c-17 0-24 15-35 27-10 11-23 19-23 34 0 13 10 22 24 22 13 0 21-7 34-7s21 7 34 7c14 0 24-9 24-22 0-15-13-23-23-34-11-12-18-27-35-27Z"/>
