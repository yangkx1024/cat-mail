<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cat Mail</title>
  <desc id="desc">An orange cat paw stamped on a cream envelope. Colors follow the system theme.</desc>
  <style>
