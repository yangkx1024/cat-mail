[package]
name = "catmail-nsh"
description = "Spike: a catmail frontend on Native Shell (nsh), GTK 4 on Linux, bodies in a web view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "catmail-nsh"
path = "src/main.rs"

[dependencies]
catmail-core.workspace = true
catmail-frontend.workspace = true
anyhow.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
jiff.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Only the Linux backend is tried; elsewhere the binary says so and exits.
[target.'cfg(target_os = "linux")'.dependencies]
nsh-core.workspace = true
nsh-base.workspace = true
glib-unix.workspace = true
resvg.workspace = true
nsh-platform-linux.workspace = true

[lints]
workspace = true
