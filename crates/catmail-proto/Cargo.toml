[package]
name = "catmail-proto"
description = "Remote mail protocol adapters (IMAP, SMTP) for cat-mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ammonia.workspace = true
base64.workspace = true
catmail-types.workspace = true
imap-next.workspace = true
mail-parser.workspace = true
# Workaround: imap-codec 2.0.0-alpha.9 uses nom's `alloc`-gated combinators but depends on
# nom with default features off, so it only builds when something else enables them.
nom = { version = "7", default-features = false, features = ["alloc"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
catmail-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
